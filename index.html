<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Github Issue Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="flex justify-center mt-20">

    <section>
        <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs md:w-lg border p-4 shadow-lg">
            <legend class="fieldset-legend">Login Form</legend>

            <div class="text-center">
                <img class="mx-auto" src="assets/github-logo.png">
                <h1 class="font-semibold text-2xl text-blue-950 mt-4">GitHub Issues Tracker</h1>
                <h3 class="text-[#64748B]">Sign in to manage your issues</h3>

            </div>

            <label class="label font-bold text-black">Username</label>
            <input id="userName" type="email" class="input w-full" placeholder="Enter Username" />
            <p class="text-purple-500">Default: admin</p>

            <label class="label font-bold text-black">Password</label>
            <input id="password" type="password" class="input w-full" placeholder="Enter Password" />
            <p class="text-purple-500">Default: admin123</p>

            <button onclick="login()" class="btn btn-primary mt-4">Login</button>

            <div class="divider">
                <span>OR</span>
            </div>

            <h1 class="text-center text-[#64748B]">Demo Credentials:</h1>

            <div class="text-center p-4 bg-slate-100 rounded-lg">
                <h1><span class="font-semibold">Username:</span> admin</h1>
                <h1><span class="font-semibold">Password:</span> admin123</h1>
            </div>
        </fieldset>

    </section>
    <script src="script/index.js"></script>
</body>

</html>
