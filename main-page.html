        <div class="navbar bg-base-100 shadow-sm flex justify-between">
            <div class="">

            </div>
            <div class="">
                <input type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
                <button class="btn btn-primary">+ New Issue</button>
            </div>
        </div>
    </nav>


    <main class="w-11/12 mx-auto mt-14">

        <div class="bg-slate-50 shadow-lg p-6">

            <button class="btn btn-primary px-10">
                Open
            </button>

            <button class="btn btn-primary px-10">
                Closed
            </button>
        </div>

        <!-- issues number show -->
        <section class="flex justify-between mt-4 bg-slate-50 shadow-lg p-6 ">
            <div class="flex gap-3 items-center">
                <div>
                    <img class="" src="assets/Aperture.png" alt="">
                </div>
                <div>
                    <h1>50 Issues</h1>
                    <p>Track and manage your project issues</p>
                </div>

            </div>
            <div class="flex gap-8">
                <div class="flex items-center gap-2">
                    <div class="badge badge-success badge-xs"></div>
                    <p>Open</p>
                </div>
                <div class="flex items-center gap-2">
                    <div class="badge badge-secondary badge-xs"></div>
                    <p>Closed</p>
                </div>
            </div>

        </section>
